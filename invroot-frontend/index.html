<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invroot – Billing Simplified</title>
    <meta name="description" content="Invroot – Professional invoicing and billing platform with full Arabic and English support." />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0D1B2A" />

    <!-- Link previews (Slack, WhatsApp, X, LinkedIn).
         These are the fallback only: scripts/prerender-seo.mjs replaces this
         whole block per marketing route at build time, and useSeo rewrites it
         at runtime. What is left here is what an app URL previews as.
         The image is 1200×630 — it used to be the 2000×2000 square logo, which
         every platform crops to a letterbox, so cards showed the middle band
         of a logo on white. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Invroot – Billing Simplified" />
    <meta property="og:description" content="Create professional invoices, track payments, and manage clients — all in one place. Full Arabic and English support." />
    <meta property="og:image" content="https://invroot.com/landing/og-invroot-en.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
